[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-control"
version = "0.1.0"
description = "Local, auditable multi-session dataset and training coordination for Laya"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
laya-control = "laya_control.cli:main"

[tool.setuptools.packages.find]
include = ["laya_control*"]

[tool.ruff]
line-length = 110
